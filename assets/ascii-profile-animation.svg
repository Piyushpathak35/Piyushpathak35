<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Animated ASCII profile art</title>
  <desc id="desc">ASCII art revealed line by line in an automatic loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#081b3a"/>
      <stop offset="100%" stop-color="#001f2f"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="55%" stop-color="#c9fbff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="line-reveal">
      <rect x="0" y="0" width="1200" height="0">
        <animate attributeName="height" values="0;720;720;0" keyTimes="0;0.78;0.92;1" dur="7.5s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="760" rx="18" fill="url(#bg)"/>
  <rect x="22" y="22" width="1156" height="716" rx="14" fill="none" stroke="#123c69" stroke-width="2"/>
  <text x="44" y="54" fill="#7dd3fc" font-family="JetBrains Mono, Consolas, monospace" font-size="18">root@piyush:~$ ./ascii_animation.py --profile</text>
  <g clip-path="url(#line-reveal)" filter="url(#glow)">
    <text xml:space="preserve" x="40" y="88" fill="url(#fg)" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" line-height="1.1">
