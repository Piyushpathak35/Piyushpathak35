<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Piyush Pathak GitHub Metrics</title>
  <desc id="desc">Initial metrics card placeholder, replaced by the GitHub Metrics workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="52%" stop-color="#0b1f46"/>
      <stop offset="100%" stop-color="#062f3d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect x="22" y="22" width="1156" height="216" rx="14" fill="none" stroke="#123c69" stroke-width="2"/>
  <path d="M44 198 C170 122, 271 225, 388 142 S620 88, 744 139 943 219, 1156 68" fill="none" stroke="url(#line)" stroke-width="4" filter="url(#glow)"/>
  <text x="58" y="72" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="30" font-weight="700">GitHub Metrics CI</text>
  <text x="58" y="112" fill="#9bdcff" font-family="JetBrains Mono, Consolas, monospace" font-size="18">This card is replaced automatically by .github/workflows/metrics.yml</text>
  <text x="58" y="158" fill="#d7f9ff" font-family="JetBrains Mono, Consolas, monospace" font-size="20">Activity | Languages | Repositories | Contribution calendar</text>
  <g fill="#00f7ff">
    <circle cx="930" cy="74" r="6"/>
    <circle cx="970" cy="74" r="6" opacity="0.75"/>
    <circle cx="1010" cy="74" r="6" opacity="0.5"/>
  </g>
  <text x="58" y="210" fill="#7dd3fc" font-family="JetBrains Mono, Consolas, monospace" font-size="16">Run the "Generate profile metrics" workflow to refresh live data.</text>
</svg>
